<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04141c"/>
      <stop offset="55%" style="stop-color:#0a2430"/>
      <stop offset="100%" style="stop-color:#061018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ee6a6"/>
      <stop offset="100%" style="stop-color:#3d9eff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <text x="320" y="72" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="url(#accent)">110 RANGE</text>
  <text x="320" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.45)">Guess a number inside the secret range</text>

  <!-- Number row 1-10 -->
  <g font-family="Arial Black, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    <rect x="70" y="160" width="44" height="44" rx="10" fill="#12232c"/>
    <text x="92" y="190" fill="#556">1</text>
    <rect x="122" y="160" width="44" height="44" rx="10" fill="#12232c"/>
    <text x="144" y="190" fill="#556">2</text>
    <rect x="174" y="160" width="44" height="44" rx="10" fill="#12232c"/>
    <text x="196" y="190" fill="#556">3</text>
    <rect x="226" y="160" width="44" height="44" rx="10" fill="#12232c"/>
    <text x="248" y="190" fill="#556">4</text>
    <rect x="278" y="160" width="44" height="44" rx="10" fill="#12232c"/>
    <text x="300" y="190" fill="#556">5</text>
    <rect x="330" y="156" width="52" height="52" rx="12" fill="#12382e" stroke="#2ee6a6" stroke-width="2"/>
    <text x="356" y="190" fill="#2ee6a6">6</text>
    <rect x="390" y="156" width="52" height="52" rx="12" fill="#12382e" stroke="#2ee6a6" stroke-width="2"/>
    <text x="416" y="190" fill="#2ee6a6">7</text>
    <rect x="450" y="156" width="52" height="52" rx="12" fill="#12382e" stroke="#2ee6a6" stroke-width="2"/>
    <text x="476" y="190" fill="#2ee6a6">8</text>
    <rect x="510" y="160" width="44" height="44" rx="10" fill="#12232c"/>
    <text x="532" y="190" fill="#556">9</text>
    <rect x="562" y="160" width="44" height="44" rx="10" fill="#12232c"/>
    <text x="584" y="190" fill="#556">10</text>
  </g>

  <rect x="230" y="236" width="180" height="44" rx="22" fill="url(#accent)"/>
  <text x="320" y="265" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#04141c">RANGE 68</text>

  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.35)">In person or online · closest to the hidden number wins</text>
</svg>
